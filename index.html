<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>

    <!-- CSS -->
    <style>

        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header{
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .card{
            background: white;
            width: 250px;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price{
            color: green;
            font-size: 20px;
            margin: 10px 0;
        }

        button{
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        #cart{
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
        }

    </style>

</head>
<body>

    <!-- Header -->
    <header>
        <h1>Simple E-Commerce Website</h1>
    </header>

    <!-- Cart -->
    <div id="cart">
        Cart Items: <span id="count">0</span>
    </div>

    <!-- Products -->
    <div class="container">

        <div class="card">
            <img src="https://via.placeholder.com/250" alt="Laptop">
            <h2>Laptop</h2>
            <p class="price">₹45,000</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250" alt="Phone">
            <h2>Smart Phone</h2>
            <p class="price">₹20,000</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">₹2,000</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

    </div>

    <!-- JavaScript -->
    <script>

        let cart = 0;

        function addToCart() {

            cart++;

            document.getElementById("count").innerText = cart;

            alert("Product added to cart!");

        }

    </script>

</body>
</html>
